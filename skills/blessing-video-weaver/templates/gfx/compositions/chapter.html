<!doctype html>
<html data-composition-variables='[
  {"id":"num","type":"string","label":"Chapter number","default":"פרק א"},
  {"id":"title","type":"string","label":"Title","default":"כשמך כן את"},
  {"id":"emoji","type":"string","label":"Emoji","default":"✨"}
]'>
<head><meta charset="utf-8"></head>
<body>
  <div data-composition-id="chapter" data-width="576" data-height="1024" data-start="0" data-duration="3.0">
    <style>
      @font-face { font-family: 'Heebo'; src: url('../fonts/heebo-hebrew.woff2') format('woff2'); font-weight: 400 900; unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
      @font-face { font-family: 'Heebo'; src: url('../fonts/heebo-latin.woff2') format('woff2'); font-weight: 400 900; }
      @font-face { font-family: 'Secular One'; src: url('../fonts/secularone-hebrew.woff2') format('woff2'); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
      @font-face { font-family: 'Secular One'; src: url('../fonts/secularone-latin.woff2') format('woff2'); }
      [data-composition-id="chapter"] {
        position: relative;
        overflow: hidden;
        background:
          radial-gradient(ellipse 120% 80% at 50% 40%, #2A1850 0%, #1C1238 55%, #160D2B 100%);
        font-family: 'Heebo', sans-serif;
        direction: rtl;
      }
      .stage {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 22px;
        padding: 80px 44px;
        box-sizing: border-box;
        text-align: center;
      }
      .num {
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 4px;
        color: #FF8FB1;
      }
      .emoji { font-size: 56px; line-height: 1; }
      .title {
        font-family: 'Secular One', 'Heebo', sans-serif;
        font-size: 76px;
        line-height: 1.15;
        color: #FFF8EC;
        max-width: 480px;
        text-shadow: 0 0 50px rgba(159, 122, 234, 0.5);
      }
      .rule {
        width: 130px;
        height: 3px;
        border-radius: 2px;
        background: linear-gradient(90deg, transparent, #F6C453, transparent);
      }
      .side-glow {
        position: absolute;
        z-index: 1;
        left: 50%;
        top: 50%;
        width: 560px;
        height: 560px;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(246, 196, 83, 0.13) 0%, transparent 62%);
      }
      .corner {
        position: absolute;
        z-index: 2;
        font-size: 26px;
        color: rgba(246, 196, 83, 0.55);
      }
      .c-tl { top: 36px; right: 40px; }
      .c-br { bottom: 36px; left: 40px; }
    </style>

    <div class="side-glow"></div>
    <div class="corner c-tl" id="ctl">✦</div>
    <div class="corner c-br" id="cbr">✦</div>
    <div class="stage">
      <div class="emoji" id="emoji"></div>
      <div class="num" id="num"></div>
      <div class="title" id="title"></div>
      <div class="rule" id="rule"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const vars = window.__hyperframes.getVariables();
      document.getElementById("num").textContent = vars.num;
      document.getElementById("title").textContent = vars.title;
      document.getElementById("emoji").textContent = vars.emoji;

      const tl = gsap.timeline({ paused: true });
      tl.from("#emoji", { scale: 0, rotation: -160, opacity: 0, duration: 0.6, ease: "back.out(2.4)" }, 0.12);
      tl.from("#num", { y: -22, opacity: 0, duration: 0.45, ease: "power3.out" }, 0.3);
      tl.from("#title", { y: 56, opacity: 0, scale: 0.92, duration: 0.7, ease: "expo.out" }, 0.42);
      tl.from("#rule", { scaleX: 0, duration: 0.5, ease: "power2.inOut" }, 0.8);
      tl.from("#ctl", { opacity: 0, rotation: 180, duration: 0.6, ease: "power2.out" }, 0.5);
      tl.from("#cbr", { opacity: 0, rotation: -180, duration: 0.6, ease: "power2.out" }, 0.62);
      tl.to("#title", { textShadow: "0 0 80px rgba(159,122,234,0.85)", duration: 0.9, ease: "sine.inOut", repeat: 1, yoyo: true }, 1.1);
      window.__timelines["chapter"] = tl;
    </script>
  </div>
</body>
</html>
