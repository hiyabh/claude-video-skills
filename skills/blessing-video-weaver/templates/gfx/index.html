<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body>
  <div data-composition-id="intro" data-width="576" data-height="1024" data-start="0" data-duration="6.0">
    <style>
      @font-face { font-family: 'Heebo'; src: url('fonts/heebo-hebrew.woff2') format('woff2'); font-weight: 400 900; unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
      @font-face { font-family: 'Heebo'; src: url('fonts/heebo-latin.woff2') format('woff2'); font-weight: 400 900; }
      @font-face { font-family: 'Secular One'; src: url('fonts/secularone-hebrew.woff2') format('woff2'); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
      @font-face { font-family: 'Secular One'; src: url('fonts/secularone-latin.woff2') format('woff2'); }
      [data-composition-id="intro"] {
        position: relative;
        overflow: hidden;
        background:
          radial-gradient(ellipse 120% 80% at 50% 38%, #2A1850 0%, #1C1238 55%, #160D2B 100%);
        font-family: 'Heebo', sans-serif;
        direction: rtl;
      }
      .big40 {
        position: absolute;
        top: 4%;
        left: 50%;
        transform: translateX(-50%);
        font-family: 'Secular One', 'Heebo', sans-serif;
        font-size: 560px;
        line-height: 1;
        color: transparent;
        -webkit-text-stroke: 2px rgba(246, 196, 83, 0.16);
        user-select: none;
      }
      .stage {
        position: relative;
        z-index: 3;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 18px;
        padding: 90px 40px;
        box-sizing: border-box;
        text-align: center;
      }
      .kicker {
        font-size: 30px;
        font-weight: 500;
        letter-spacing: 2px;
        color: #FF8FB1;
      }
      .name {
        font-family: 'Secular One', 'Heebo', sans-serif;
        font-size: 150px;
        line-height: 1.04;
        color: #FFF8EC;
        text-shadow: 0 0 60px rgba(159, 122, 234, 0.55);
      }
      .age {
        font-family: 'Secular One', 'Heebo', sans-serif;
        font-size: 92px;
        line-height: 1.05;
        color: #F6C453;
        text-shadow: 0 0 44px rgba(246, 196, 83, 0.45);
      }
      .sub {
        margin-top: 10px;
        font-size: 32px;
        font-weight: 600;
        color: rgba(255, 248, 236, 0.92);
      }
      .rule {
        width: 150px;
        height: 3px;
        border-radius: 2px;
        background: linear-gradient(90deg, transparent, #F6C453, transparent);
      }
      .confetti {
        position: absolute;
        z-index: 2;
        top: -40px;
        border-radius: 3px;
        will-change: transform;
      }
      .glow {
        position: absolute;
        z-index: 1;
        left: 50%;
        top: 46%;
        width: 520px;
        height: 520px;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(159, 122, 234, 0.22) 0%, transparent 65%);
      }
    </style>

    <div class="big40" id="big40">40</div>
    <div class="glow"></div>
    <div id="confetti-layer"></div>
    <div class="stage">
      <div class="kicker" id="kicker">יום הולדת שמח!</div>
      <div class="name" id="name">אמונה</div>
      <div class="rule" id="rule"></div>
      <div class="age" id="age">בת 40</div>
      <div class="sub" id="sub">כל האחים התגייסו לברך ❤</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};

      function mulberry32(a) {
        return function () {
          a |= 0; a = (a + 0x6D2B79F5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rand = mulberry32(40);
      const COLORS = ["#F6C453", "#FF8FB1", "#9F7AEA", "#FFE08A", "#FFF8EC"];
      const layer = document.getElementById("confetti-layer");
      const pieces = [];
      const N_CONFETTI = 30;
      for (let i = 0; i < N_CONFETTI; i++) {
        const el = document.createElement("div");
        el.className = "confetti";
        const w = 7 + rand() * 9;
        el.style.width = w + "px";
        el.style.height = w * (0.55 + rand() * 0.9) + "px";
        el.style.left = (rand() * 100) + "%";
        el.style.background = COLORS[Math.floor(rand() * COLORS.length)];
        layer.appendChild(el);
        pieces.push(el);
      }

      const tl = gsap.timeline({ paused: true });
      tl.from("#kicker", { y: -36, opacity: 0, duration: 0.55, ease: "power3.out" }, 0.15);
      tl.from("#name", { scale: 0.25, opacity: 0, duration: 0.9, ease: "elastic.out(1, 0.55)" }, 0.45);
      tl.from("#rule", { scaleX: 0, duration: 0.5, ease: "power2.out" }, 0.95);
      tl.from("#age", { y: 70, opacity: 0, duration: 0.7, ease: "back.out(2.2)" }, 1.15);
      tl.from("#sub", { y: 26, opacity: 0, duration: 0.6, ease: "power2.out" }, 1.65);
      tl.from("#big40", { opacity: 0, scale: 1.18, duration: 1.4, ease: "power1.out" }, 0.3);
      tl.to("#name", { textShadow: "0 0 90px rgba(159,122,234,0.85)", duration: 1.2, ease: "sine.inOut", repeat: 2, yoyo: true }, 1.6);

      pieces.forEach((el, i) => {
        const fallDur = 3.2 + rand() * 2.4;
        const delay = 0.5 + rand() * 2.2;
        const drift = (rand() - 0.5) * 130;
        const spins = 140 + rand() * 420;
        tl.to(el, { y: 1120, x: drift, rotation: spins, duration: fallDur, ease: "none" }, delay);
        tl.from(el, { opacity: 0, duration: 0.25, ease: "power1.out" }, delay);
      });

      window.__timelines["intro"] = tl;
    </script>
  </div>
</body>
</html>
